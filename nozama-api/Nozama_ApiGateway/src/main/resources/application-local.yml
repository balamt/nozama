server:
  port: 8090 
  ssl:
    key-store: file:${NOZAMA_CERT}/localhost/localhost.jks
    key-store-password: password
    key-alias: localhost
    key-store-type: JKS

eureka:
  client:
    eureka-server-port: 8761
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: https://localhost:8761/eureka/
  instance:
    leaseRenewalIntervalInSeconds: 120000
##This property has to be true, so that it uses the IP address, instead of localhost or 127.0.0.1
    prefer-ip-address: true

spring:
  application:
    name: nozama-api-gateway
  zipkin:
    base-url: http://localhost:9411/
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedHeaders: "*"
            allowedMethods:
              - GET
              - POST
      routes:
      - id: nozama-productservice-category
        uri: https://localhost:8082
        predicates:
        - Path=/category/**
      - id: nozama-productservice
        uri: https://localhost:8082
        predicates:
        - Path=/product/**
      - id: nozama-productservice-api
        uri: https://localhost:8082
        predicates:
        - Path=/product-api/**
      - id: nozama-productservice-sw
        uri: https://localhost:8082
        predicates:
        - Path=/product/v3/**
      - id: nozama-orderservice
        uri: https://localhost:8094
        predicates:
        - Path=/order/**
      - id: nozama-orderservice-sw
        uri: https://localhost:8094
        predicates:
        - Path=/order/v3/**
      - id: nozama-orderservice-api
        uri: https://localhost:8094
        predicates:
        - Path=/order-api/**
      - id: nozama-userservice
        uri: https://localhost:8081
        predicates:
        - Path=/user/**
      - id: nozama-userservice-api
        uri: https://localhost:8081
        predicates:
        - Path=/user-api/**
      - id: nozama-userservice-sw
        uri: https://localhost:8081
        predicates:
        - Path=/user/v3/**
      - id: nozama-userauthservice
        uri: https://localhost:8089
        predicates:
        - Path=/auth/**  
      - id: nozama-userauthservice-health
        uri: https://localhost:8089
        predicates:
        - Path=/auth-health/**  
      - id: nozama-userauthservice-sw
        uri: https://localhost:8089
        predicates:
        - Path=/auth/v3/**
      - id: nozama-userauthservice-api
        uri: https://localhost:8089
        predicates:
        - Path=/userauth-api/**
      - id: nozama-cartservice
        uri: https://localhost:8088
        predicates:
        - Path=/cart/** 
      - id: nozama-cartservice-api
        uri: https://localhost:8088
        predicates:
        - Path=/cart-api/** 
      - id: nozama-cartservice-sw
        uri: https://localhost:8088
        predicates:
        - Path=/cart/v3/**
      - id: nozama-config-service
        uri: https://localhost:8888
        predicates:
        - Path=/config/**
      - id: nozama-addressservice
        uri: https://localhost:8092
        predicates:
        - Path=/address/**
      - id: nozama-addressservice-sw
        uri: https://localhost:8092
        predicates:
        - Path=/address/v3/**
      - id: nozama-addressservice-api
        uri: https://localhost:8092
        predicates:
        - Path=/address-api/**

logging:
  file: 
    path: "../log" 
    name: "${logging.file.path}/${spring.application.name:nozama}_log.log"
  level:
    ROOT: INFO
    org:
      hibernate:
        SQL: DEBUG
        type: TRACE
#      springframework:
#        security: DEBUG
#        type: TRACE

#Prometheus
management:
#  server:
#    port: 8762
  endpoints:
    web:
      exposure:
        include: "*"
 
  endpoint:
    health:
      show-details: always
  metrics:
    tags: 
      application: ${spring.application.name}
      env: dev

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: "product"
      paths-to-match:
        - "/product/**"
        - "/category/**"
        - "/v3/**"
    - group: "order"
      paths-to-match:
        - "/order/**"
        - "/v3/**"
    - group: "user"
      paths-to-match:
        - "/user/**"
        - "/v3/**"
    - group: "auth"
      paths-to-match:
        - "/auth/**"
        - "/auth-health/**"
        - "/v3/**"
    - group: "cart"
      paths-to-match:
        - "/cart/**"
        - "/v3/**"
    - group: "address"
      paths-to-match:
        - "/address/**"
        - "/v3/**"